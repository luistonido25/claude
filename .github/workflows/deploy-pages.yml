name: Publish to GitHub Pages

# GitHub Pages for this repo serves the gh-pages branch (root).
# This workflow keeps gh-pages in sync with the development branch,
# so every push goes live automatically.

on:
  push:
    branches: [main, claude/claude-md-docs-jziuo2]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-publish
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Push current branch to gh-pages
        run: git push origin HEAD:gh-pages --force
